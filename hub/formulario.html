<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0D2137">
<title>AmericaMex · Empieza aquí</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1A3A5C;--navy-d:#0D2137;--red:#E53935;--bg:#EEF2F7;--ink:#14202F;--muted:#5B6878;--line:#D3DCE6;--ok:#17914A;--wa:#1E8E4E}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
header{color:#fff;padding:16px 16px 44px;text-align:center;background-color:var(--navy-d);background-image:radial-gradient(520px 240px at 0 -30%,rgba(36,80,126,.95),transparent 65%),radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.3px);background-size:auto,20px 20px}
header b{font:800 21px/1.2 Montserrat,system-ui,sans-serif;letter-spacing:-.01em}
header small{display:block;opacity:.75;font-weight:600;margin-top:3px;font-size:13.5px}
.wrap{max-width:540px;margin:-30px auto 0;padding:0 14px calc(40px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.28);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:8px;transition:width .3s}
.lang{display:flex;gap:4px}
.lang button{border:1.5px solid rgba(255,255,255,.4);background:transparent;border-radius:20px;padding:5px 11px;font:700 12px Inter,system-ui,sans-serif;color:#fff;cursor:pointer}
.lang button.on{background:#fff;color:var(--navy-d);border-color:#fff}
.card{background:#fff;border-radius:20px;padding:22px 18px 18px;box-shadow:0 14px 34px -18px rgba(13,33,55,.45)}
.paso{display:none}.paso.on{display:block;animation:entra .25s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;font:800 22px/1.2 Montserrat,system-ui,sans-serif;color:var(--navy-d);letter-spacing:-.01em}
p.s{margin:0 0 14px;color:var(--muted);font-size:14.5px;font-weight:500}
label{display:block;font-size:13.5px;font-weight:700;color:#3F4D62;margin:14px 0 6px}
label .op{font-weight:500;color:#8A97AA}
input,select,textarea{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:13px;font:600 16px Inter,system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(26,58,92,.14)}
input.mal{border-color:var(--red);box-shadow:0 0 0 3px rgba(229,57,53,.14)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.opc{display:grid;gap:10px;margin-top:6px}
.opc button{display:flex;align-items:center;gap:14px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:15px 16px;font:700 16.5px Inter,system-ui,sans-serif;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.opc button:active{transform:scale(.99)}
.opc button i{font-style:normal;font-size:26px;flex:none;width:46px;height:46px;border-radius:13px;background:#EEF2F7;display:grid;place-items:center}
.opc button small{display:block;font-weight:500;color:var(--muted);font-size:13.5px;margin-top:2px}
.opc button.on{border-color:var(--navy);background:#EAF1FA}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:13px 8px;font:700 15px Inter,system-ui,sans-serif;color:var(--ink);cursor:pointer}
.seg button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.per{background:#F4F7FB;border-radius:15px;padding:12px 12px 14px;margin-top:10px;position:relative}
.per .x{position:absolute;top:4px;right:6px;border:none;background:none;font-size:20px;color:var(--muted);padding:6px;cursor:pointer}
.per b.t{display:block;font:800 12px Montserrat,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--navy);margin-bottom:2px}
.chk{display:flex;gap:10px;align-items:center;margin:12px 0 0;font-weight:600;font-size:14.5px;color:var(--ink);cursor:pointer}
.chk input{width:22px;height:22px;flex:none;-webkit-appearance:auto;appearance:auto;padding:0;accent-color:var(--navy)}
.nav{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;padding:16px;font:800 16.5px Inter,system-ui,sans-serif;background:var(--red);color:#fff;cursor:pointer;box-shadow:0 10px 22px -12px rgba(229,57,53,.9);text-decoration:none}
.btn.atras{flex:0 0 auto;background:#fff;color:var(--navy);border:1.5px solid var(--line);box-shadow:none;padding:16px 18px}
.btn.sec{background:#fff;color:var(--navy);border:1.5px dashed #9FB1C7;box-shadow:none;margin-top:12px;width:100%;padding:13px}
.btn.navy{background:var(--navy);box-shadow:0 10px 22px -12px rgba(13,33,55,.9)}
.btn.wa{background:var(--wa);box-shadow:0 10px 22px -12px rgba(30,142,78,.9)}
.btn:disabled{opacity:.6}
.err{background:#FDECEA;color:#A31515;border-radius:13px;padding:12px 14px;font-weight:700;font-size:14.5px;margin-bottom:12px;display:none}
.note{background:#EEF3FA;color:#3D5573;border-radius:13px;padding:12px 14px;font-size:13.5px;font-weight:600;margin-top:14px;line-height:1.5}
.note.am{background:#FFF6DC;color:#6B5200}
.docs{list-style:none;margin:10px 0 0;padding:0}
.docs li{display:flex;gap:10px;padding:10px 12px;background:#F4F7FB;border-radius:12px;margin-bottom:6px;font-weight:600;font-size:14.5px}
.docs li::before{content:"📄"}
.fin{text-align:center}
.fin .big{font-size:54px;line-height:1}
.quien{background:#EAF1FA;border:1.5px dashed #9FB1C7;border-radius:13px;padding:12px;margin:10px 0 14px;font-weight:800;color:var(--navy-d);text-align:center;font-size:18px}
.pasos2{counter-reset:p;list-style:none;padding:0;margin:14px 0 0;text-align:left}
.pasos2>li{counter-increment:p;position:relative;padding:0 0 18px 44px}
.pasos2>li::before{content:counter(p);position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;font:800 15px Montserrat,system-ui,sans-serif;display:grid;place-items:center}
.pasos2>li b{display:block;font-size:16px;margin-bottom:6px}
.pasos2 .btn{width:100%}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.pie{text-align:center;color:var(--muted);font-size:12.5px;font-weight:600;margin-top:16px}
.aviso{background:#E3F3E7;color:#1B5E2C;border-radius:14px;padding:14px;font-weight:700;margin-bottom:12px;display:none}
.aviso .btn{margin-top:10px;width:100%}
@media (prefers-reduced-motion:reduce){.paso.on{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<header>
  <div class="top" style="max-width:512px;margin:0 auto 12px"><div class="bar" aria-hidden="true"><i id="barra"></i></div><div class="lang"><button type="button" data-l="es">ES</button><button type="button" data-l="en">EN</button></div></div>
  <b>AmericaMex</b><small id="hSub"></small>
</header>
<div class="wrap">
  <div class="aviso" id="yaEnviado"><span data-t="ya"></span><button type="button" class="btn navy" id="yaDocs" data-t="subir"></button><button type="button" class="btn sec" id="yaOtro" data-t="otroForm"></button></div>
  <div class="card" id="form">
    <div class="err" id="err" role="alert"></div>

    <!-- 0 · ¿qué necesitas? -->
    <div class="paso" data-p="serv">
      <h2 data-t="q0"></h2><p class="s" data-t="q0s"></p>
      <div class="opc" id="servicio">
        <button type="button" data-v="impuestos"><i>🧾</i><span><span data-t="o_imp"></span><small data-t="o_imp_s"></small></span></button>
        <button type="button" data-v="itin"><i>🪪</i><span><span data-t="o_itin"></span><small data-t="o_itin_s"></small></span></button>
        <button type="button" data-v="migracion"><i>🗽</i><span><span data-t="o_mig"></span><small data-t="o_mig_s"></small></span></button>
        <button type="button" data-v="otro"><i>📂</i><span><span data-t="o_otro"></span><small data-t="o_otro_s"></small></span></button>
      </div>
    </div>

    <!-- 1 · tus datos -->
    <div class="paso" data-p="tu">
      <h2 data-t="q1"></h2><p class="s" data-t="q1s"></p>
      <div class="g2"><div><label data-t="nombre"></label><input id="nombre" autocomplete="given-name"></div>
      <div><label><span data-t="nombre2"></span> <span class="op" data-t="opc"></span></label><input id="nombre2" autocomplete="additional-name"></div></div>
      <div class="g3"><div><label data-t="apellidos"></label><input id="apellidos" autocomplete="family-name"></div>
      <div><label>Sr./Jr.</label><select id="sufijo"><option value="">—</option><option>Sr.</option><option>Jr.</option><option>II</option><option>III</option></select></div></div>
      <label data-t="tel"></label><input id="telefono" type="tel" inputmode="tel" autocomplete="tel" placeholder="(619) 555-0000">
      <div class="soloTax">
        <label data-t="nac"></label><input id="nacimiento" type="date" autocomplete="bday">
        <label><span data-t="correo"></span> <span class="op" data-t="opc"></span></label><input id="correo" type="email" inputmode="email" autocomplete="email">
        <label data-t="ocup"></label><input id="ocupacion" autocomplete="organization-title">
        <div class="soloC"><label data-t="ssnTu"></label><input id="ssnT" inputmode="numeric" autocomplete="off" maxlength="11" placeholder="XXX-XX-XXXX"></div>
      </div>
      <div class="noTax">
        <label data-t="coment2"></label><textarea id="coment2" rows="3"></textarea>
      </div>
    </div>

    <!-- 2 · dirección -->
    <div class="paso" data-p="dir">
      <h2 data-t="q2"></h2><p class="s" data-t="q2s"></p>
      <label data-t="dir"></label><input id="dirCalle" autocomplete="address-line1">
      <div class="g2"><div><label><span data-t="apto"></span> <span class="op" data-t="opc"></span></label><input id="dirApto" autocomplete="address-line2"></div>
      <div><label data-t="ciudad"></label><input id="dirCiudad" autocomplete="address-level2"></div></div>
      <div class="g2"><div><label data-t="estado"></label><input id="dirEstado" autocomplete="address-level1" maxlength="30" placeholder="CA"></div>
      <div><label data-t="zip"></label><input id="dirZip" inputmode="numeric" autocomplete="postal-code" maxlength="10"></div></div>
    </div>

    <!-- 3 · familia -->
    <div class="paso" data-p="fam">
      <h2 data-t="q3"></h2><p class="s" data-t="q3s"></p>
      <label data-t="civil"></label>
      <div class="seg" id="civil"><button type="button" data-v="soltero" data-t="o_sol"></button><button type="button" data-v="casado" data-t="o_cas"></button><button type="button" data-v="jefe" data-t="o_jef"></button><button type="button" data-v="viudo" data-t="o_viu"></button></div>
      <label class="chk"><input type="checkbox" id="itinYo"><span data-t="itinYo"></span></label>
      <div class="per" id="espWrap" style="display:none">
        <b class="t" data-t="esp"></b>
        <div class="g2"><div><label data-t="pnom"></label><input id="espNombre" autocomplete="off"></div><div><label data-t="apellidos"></label><input id="espApellidos" autocomplete="off"></div></div>
        <div class="g2"><div><label data-t="nac"></label><input id="espNac" type="date"></div><div><label data-t="ocup2"></label><input id="espOcup" autocomplete="off"></div></div>
        <div class="soloC"><label data-t="segS"></label><input id="espSsn" inputmode="numeric" autocomplete="off" maxlength="11" placeholder="XXX-XX-XXXX"></div>
        <label class="chk"><input type="checkbox" id="espItin"><span data-t="itinEl"></span></label>
      </div>
      <label style="margin-top:20px" data-t="deps"></label>
      <div id="deps"></div>
      <button type="button" class="btn sec" id="addDep" data-t="addDep"></button>
      <label style="margin-top:18px"><span data-t="coment"></span> <span class="op" data-t="opc"></span></label><textarea id="coment" rows="2"></textarea>
    </div>

    <!-- 4 · depósito directo (solo en el enlace que manda la oficina) -->
    <div class="paso" data-p="banco">
      <h2 data-t="s5"></h2><p class="s" data-t="s5s"></p>
      <label><span data-t="banco"></span> <span class="op" data-t="opc"></span></label><input id="bancoC" autocomplete="off">
      <div class="g2"><div><label data-t="ruta"></label><input id="rutaC" inputmode="numeric" maxlength="9" autocomplete="off"></div>
      <div><label data-t="cuenta"></label><input id="cuentaC" inputmode="numeric" maxlength="17" autocomplete="off"></div></div>
      <label data-t="tipo"></label><select id="tipoC"><option value="checking">Checking</option><option value="savings">Savings</option></select>
    </div>

    <!-- modo seguro: solo lo delicado, cuando la oficina lo pide -->
    <div class="paso" data-p="seguro">
      <h2 data-t="qs"></h2><p class="s" data-t="qss"></p>
      <label data-t="nombreC"></label><input id="segNombre" autocomplete="name">
      <label data-t="ssnTu"></label><input id="ssn" inputmode="numeric" autocomplete="off" maxlength="11" placeholder="XXX-XX-XXXX">
      <div id="segPers"></div>
      <button type="button" class="btn sec" id="addSeg" data-t="addSeg"></button>
      <label style="margin-top:20px"><span data-t="s5"></span> <span class="op" data-t="opc"></span></label>
      <input id="banco" autocomplete="off" data-ph="banco">
      <div class="g2" style="margin-top:10px"><input id="ruta" inputmode="numeric" maxlength="9" autocomplete="off" data-ph="ruta"><input id="cuenta" inputmode="numeric" maxlength="17" autocomplete="off" data-ph="cuenta"></div>
      <select id="tipoCta" style="margin-top:10px"><option value="checking">Checking</option><option value="savings">Savings</option></select>
      <div class="note" data-t="priv"></div>
    </div>

    <input class="hp" id="web" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="nav" id="nav"><button type="button" class="btn atras" id="atras" aria-label="Atrás">←</button><button type="button" class="btn" id="sig"></button></div>
    <div class="note am" id="notaSsn" data-t="noSsn"></div>
  </div>

  <!-- final · documentos -->
  <div class="card fin" id="gracias" style="display:none">
    <div class="big">✅</div>
    <h2 data-t="gracias"></h2><p class="s" data-t="gracias2" id="gr2"></p>
    <ol class="pasos2" id="pasos2">
      <li><b data-t="p2a"></b><ul class="docs" id="docsLista"></ul></li>
      <li><b data-t="p2b"></b><div class="quien" id="quien"></div><button type="button" class="btn navy" id="btnDocs" data-t="subir"></button></li>
      <li><b data-t="p2c"></b><a class="btn wa" id="btnWa" target="_blank" rel="noopener" data-t="avisar"></a></li>
    </ol>
    <p class="s" style="margin:6px 0 0" data-t="p2fin"></p>
  </div>
  <div class="pie">🔒 <span data-t="pie"></span></div>
</div>

  gracias:'Done! We received your information.',gracias2:'Now just send us your documents:',p2a:'Have these documents ready',p2b:'Upload them under this name',p2c:'Let us know you are done',subir:'📎 Upload my documents',avisar:'Message us on WhatsApp',
  p2fin:'Don\'t have them right now? Upload them later with the same link or bring them to the office.',ya:'You already sent your information. Do you still need to upload your documents?',otroForm:'Fill out another form',
  d_w2:'W-2 and/or 1099 (all that you have)',d_id:'Photo ID (ID card or passport)',d_acta:'Birth certificates of the children',d_esc:'School or doctor records of the children',d_guard:'Childcare receipts (if you paid)',d_ant:'Last year\'s tax return (if you have it)',d_pas:'Valid passport of whoever needs the ITIN',d_mig:'Your green card, passport or the document for your case',d_otro:'The document you need processed',
  waMsg:'Hi, I am {n}. I filled out my questionnaire and uploaded my documents.',
  falta:'Enter your first name.',faltaAp:'Enter your last name.',faltaTel:'Enter a 10-digit phone number.',faltaServ:'Tap an option to continue.',errSsn:'The SSN or ITIN must have 9 digits.',errRuta:'The routing number must have 9 digits.',errNet:'Could not send. Check your internet and try again.',errNada:'Enter at least one number.',
  qs:'Protected information',qss:'Your preparer asked for it to finish your return.',nombreC:'Your full name *',ssnTu:'Your SSN or ITIN',addSeg:'+ Add spouse or dependent',segN:'Full name',segS:'SSN or ITIN',s5:'Direct deposit for your refund',s5s:'So your refund goes straight to your account. If you prefer a check, leave it empty.',tipo:'Account type',banco:'Bank',ruta:'Routing (9 digits)',cuenta:'Account number',
  priv:'🔒 Sent encrypted and deleted automatically within 48 hours, once we enter it.',pie:'Your information is sent encrypted and only the AmericaMex office sees it.',segOk:'Done! We received your information securely.',segOk2:'You can close this page now.'}
};
const Q = new URLSearchParams(location.search);
let L = (Q.get('l') || (navigator.language || 'es')).slice(0, 2) === 'en' ? 'en' : 'es';
const SEGURO = Q.get('seguro') === '1';
const COMPLETO = Q.get('c') === '1';   // enlace o QR que manda la oficina: sí pide seguro social y banco (cifrado)
const $ = id => document.getElementById(id);
const BORR = 'amx_form_borrador2', ENV = 'amx_form_enviado';
let serv = '', civil = '', paso = 0, nombreEnviado = '';
const esTax = () => serv === 'impuestos' || serv === 'itin';
const pasos = () => SEGURO ? ['seguro'] : (esTax() ? ['serv', 'tu', 'dir', 'fam'].concat(COMPLETO ? ['banco'] : []) : ['serv', 'tu']);
const tx = k => T[L][k];

function pintar() {
  document.documentElement.lang = L;
  document.querySelectorAll('[data-t]').forEach(e => { if (T[L][e.dataset.t] !== undefined) e.textContent = T[L][e.dataset.t]; });
  document.querySelectorAll('[data-ph]').forEach(e => { e.placeholder = tx(e.dataset.ph); });
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === L));
  document.querySelectorAll('.dep').forEach((d, i) => {
    d.querySelector('.t').textContent = tx('dep') + ' ' + (i + 1);
    d.querySelector('.dn').placeholder = tx('depN'); d.querySelector('.da').placeholder = tx('depA');
    d.querySelectorAll('[data-dl]').forEach(x => { x.textContent = tx(x.dataset.dl); });
    const sel = d.querySelector('.dp'), v = sel.selectedIndex; sel.innerHTML = tx('parOps').map(o => '<option>' + o + '</option>').join(''); sel.selectedIndex = Math.max(0, v);
  });
  document.querySelectorAll('.sp').forEach(d => { d.querySelector('.sn').placeholder = tx('segN'); d.querySelector('.ss').placeholder = tx('segS'); });
  const ps = pasos(), id = ps[Math.min(paso, ps.length - 1)];
  document.querySelectorAll('.paso').forEach(p => p.classList.toggle('on', p.dataset.p === id));
  document.querySelectorAll('.soloTax').forEach(e => { e.style.display = esTax() ? '' : 'none'; });
  document.querySelectorAll('.noTax').forEach(e => { e.style.display = esTax() ? 'none' : ''; });
  document.querySelectorAll('.soloC').forEach(e => { e.style.display = COMPLETO ? '' : 'none'; });
  $('notaSsn').textContent = tx(COMPLETO ? 'priv' : 'noSsn'); $('notaSsn').className = COMPLETO ? 'note' : 'note am';
  document.querySelectorAll('#servicio button').forEach(b => b.classList.toggle('on', b.dataset.v === serv));
  document.querySelectorAll('#civil button').forEach(b => b.classList.toggle('on', b.dataset.v === civil));
  $('espWrap').style.display = civil === 'casado' ? 'block' : 'none';
  $('atras').style.display = paso > 0 ? '' : 'none';
  $('nav').style.display = id === 'serv' ? 'none' : 'flex';
  $('sig').textContent = paso >= ps.length - 1 ? tx('enviar') : tx('sig');
  $('notaSsn').style.display = SEGURO || id === 'serv' ? 'none' : 'block';
  $('barra').style.width = Math.round((paso + 1) / (ps.length + 1) * 100) + '%';
  $('hSub').textContent = tx(SEGURO ? 'qs' : 'hSub');
  if ($('quien')) $('quien').textContent = nombreCompleto();
}
function irPaso(n) { paso = n; $('err').style.display = 'none'; pintar(); window.scrollTo({ top: 0, behavior: 'smooth' }); guardarBorrador(); }
document.querySelector('.lang').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { L = b.dataset.l; pintar(); if ($('gracias').style.display !== 'none') pintarDocs(); } });
$('servicio').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; serv = b.dataset.v; if (serv === 'itin') $('itinYo').checked = true; irPaso(1); });
$('civil').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; civil = b.dataset.v; pintar(); guardarBorrador(); });
function fmtSsn(el) { const d = el.value.replace(/\D/g, '').slice(0, 9); el.value = d.length > 5 ? d.slice(0, 3) + '-' + d.slice(3, 5) + '-' + d.slice(5) : (d.length > 3 ? d.slice(0, 3) + '-' + d.slice(3) : d); }
function fmtTel(el) { const d = el.value.replace(/\D/g, ''); if (el.value.trim().startsWith('+') || d.length > 10) return; el.value = d.length > 6 ? '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6) : (d.length > 3 ? '(' + d.slice(0, 3) + ') ' + d.slice(3) : d); }
['ssn', 'ssnT', 'espSsn'].forEach(i => $(i).addEventListener('input', e => fmtSsn(e.target)));
$('telefono').addEventListener('input', e => fmtTel(e.target));

function addDep(x) {
  x = x || {};
  const d = document.createElement('div'); d.className = 'per dep';
  let ms = ''; for (let m = 12; m >= 0; m--) ms += '<option>' + m + '</option>';
  d.innerHTML = '<button type="button" class="x" aria-label="Quitar">✕</button><b class="t"></b><div class="g2"><input class="dn" autocomplete="off"><input class="da" autocomplete="off"></div>' +
    '<div class="g2"><div><label data-dl="nac"></label><input class="dd" type="date"></div><div><label data-dl="parent"></label><select class="dp"></select></div></div>' +
    '<label data-dl="meses"></label><select class="dm">' + ms + '</select><div class="soloC"><label data-dl="segS"></label><input class="ds" inputmode="numeric" autocomplete="off" maxlength="11" placeholder="XXX-XX-XXXX"></div><label class="chk"><input type="checkbox" class="di"><span data-dl="itinEl"></span></label>';
  d.querySelector('.x').onclick = () => { d.remove(); pintar(); guardarBorrador(); };
  d.querySelector('.ds').addEventListener('input', e => fmtSsn(e.target));
  $('deps').appendChild(d); pintar();
  d.querySelector('.dn').value = x.n || ''; d.querySelector('.da').value = x.a || ($('apellidos').value || ''); d.querySelector('.dd').value = x.f || '';
  if (x.p != null) d.querySelector('.dp').selectedIndex = x.p; d.querySelector('.dm').value = x.m || '12'; d.querySelector('.di').checked = !!x.i;
  return d;
}
$('addDep').onclick = () => { addDep().querySelector('.dn').focus(); guardarBorrador(); };
function addSeg() {
  const d = document.createElement('div'); d.className = 'per sp';
  d.innerHTML = '<button type="button" class="x" aria-label="Quitar">✕</button><input class="sn" autocomplete="off" style="margin-top:4px"><input class="ss" inputmode="numeric" autocomplete="off" maxlength="11" style="margin-top:10px">';
  d.querySelector('.x').onclick = () => d.remove();
  d.querySelector('.ss').addEventListener('input', e => fmtSsn(e.target));
  $('segPers').appendChild(d); pintar(); return d;
}
$('addSeg').onclick = () => addSeg().querySelector('.sn').focus();

function error(m, el) { const e = $('err'); e.textContent = m; e.style.display = 'block'; e.scrollIntoView({ behavior: 'smooth', block: 'center' }); if (el) { el.classList.add('mal'); el.focus(); el.addEventListener('input', () => el.classList.remove('mal'), { once: true }); } return false; }
const ssnOk = el => { const d = el.value.replace(/\D/g, ''); return !d || d.length === 9; };
function valida(id) {
  if (id === 'serv' && !serv) return error(tx('faltaServ'));
  if (id === 'tu') {
    if (!$('nombre').value.trim()) return error(tx('falta'), $('nombre'));
    if (!$('apellidos').value.trim()) return error(tx('faltaAp'), $('apellidos'));
    if ($('telefono').value.replace(/\D/g, '').length < 10) return error(tx('faltaTel'), $('telefono'));
    if (COMPLETO && esTax() && !ssnOk($('ssnT'))) return error(tx('errSsn'), $('ssnT'));
  }
  if (id === 'fam' && COMPLETO) {
    if (civil === 'casado' && !ssnOk($('espSsn'))) return error(tx('errSsn'), $('espSsn'));
    const malo = [...document.querySelectorAll('.dep .ds')].find(x => !ssnOk(x));
    if (malo) return error(tx('errSsn'), malo);
  }
  if (id === 'banco') { const r = $('rutaC').value.replace(/\D/g, ''); if (r && r.length !== 9) return error(tx('errRuta'), $('rutaC')); }
  return true;
}
function nombreCompleto() {
  if (nombreEnviado) return nombreEnviado;
  if (SEGURO) return $('segNombre').value.trim();
  return [$('nombre').value, $('nombre2').value, $('apellidos').value, $('sufijo').value].map(x => String(x || '').trim()).filter(Boolean).join(' ');
}
$('atras').onclick = () => irPaso(Math.max(0, paso - 1));
$('sig').onclick = () => { const ps = pasos(); if (!valida(ps[paso])) return; if (paso < ps.length - 1) irPaso(paso + 1); else enviar(); };
$('form').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); $('sig').click(); } });

function depsDatos() {
  return [...document.querySelectorAll('.dep')].map(d => ({ nombre: d.querySelector('.dn').value, apellidos: d.querySelector('.da').value, nacimiento: d.querySelector('.dd').value, ssn: COMPLETO ? d.querySelector('.ds').value : '', parentesco: d.querySelector('.dp').value, meses: d.querySelector('.dm').value, itin: d.querySelector('.di').checked })).filter(d => (d.nombre + d.apellidos).trim());
}
async function enviar() {
  $('err').style.display = 'none';
  let body;
  if (SEGURO) {
    const nombre = $('segNombre').value.trim();
    if (!nombre) return error(tx('falta'), $('segNombre'));
    const ssn = $('ssn').value.replace(/\D/g, '');
    if (ssn && ssn.length !== 9) return error(tx('errSsn'), $('ssn'));
    const ruta = $('ruta').value.replace(/\D/g, '');
    if (ruta && ruta.length !== 9) return error(tx('errRuta'), $('ruta'));
    const pers = [...document.querySelectorAll('.sp')].map(d => ({ nombre: d.querySelector('.sn').value, apellidos: '', nacimiento: '', ssn: d.querySelector('.ss').value, parentesco: '', meses: '' })).filter(p => p.nombre.trim() || p.ssn.trim());
    const malo = pers.find(p => p.ssn.replace(/\D/g, '').length !== 9);
    if (malo) return error(tx('errSsn'));
    if (!ssn && !pers.length && !ruta && !$('cuenta').value.trim()) return error(tx('errNada'), $('ssn'));
    body = { accion: 'enviar', idioma: L, web: $('web').value, nombre, servicio: 'seguro', ssn, comentarios: '🔒 Datos protegidos que pidió la oficina', dependientes: pers,
      banco: ($('banco').value || ruta || $('cuenta').value) ? { banco: $('banco').value, ruta, cuenta: $('cuenta').value, tipo: $('tipoCta').value } : null };
  } else {
    const deps = depsDatos();
    const itin = [];
    if (esTax()) { if ($('itinYo').checked) itin.push(nombreCompleto()); if (civil === 'casado' && $('espItin').checked) itin.push(($('espNombre').value + ' ' + $('espApellidos').value).trim() || 'esposo(a)'); deps.filter(d => d.itin).forEach(d => itin.push((d.nombre + ' ' + d.apellidos).trim())); }
    const com = [esTax() ? $('coment').value.trim() : $('coment2').value.trim(), itin.length ? '🪪 Necesitan ITIN: ' + itin.join('; ') : ''].filter(Boolean).join(' · ');
    body = { accion: 'enviar', idioma: L, web: $('web').value, nombre: $('nombre').value.trim(), nombre2: $('nombre2').value, apellidos: $('apellidos').value, sufijo: $('sufijo').value,
      nacimiento: $('nacimiento').value, telefono: $('telefono').value, correo: $('correo').value, ocupacion: $('ocupacion').value, servicio: serv,
      dirCalle: $('dirCalle').value, dirApto: $('dirApto').value, dirCiudad: $('dirCiudad').value, dirEstado: $('dirEstado').value, dirZip: $('dirZip').value,
      ssn: COMPLETO && esTax() ? $('ssnT').value.replace(/\D/g, '') : '', estado_civil: esTax() ? civil : '', comentarios: com,
      esposo: esTax() && civil === 'casado' && ($('espNombre').value + $('espApellidos').value).trim() ? { nombre: $('espNombre').value, nombre2: '', apellidos: $('espApellidos').value, nacimiento: $('espNac').value, ssn: COMPLETO ? $('espSsn').value : '', ocupacion: $('espOcup').value } : null,
      dependientes: esTax() ? deps.map(d => ({ nombre: d.nombre, apellidos: d.apellidos, nacimiento: d.nacimiento, ssn: d.ssn, parentesco: d.parentesco + (d.itin ? ' (ITIN)' : ''), meses: d.meses })) : [],
      banco: COMPLETO && esTax() && ($('bancoC').value || $('rutaC').value || $('cuentaC').value) ? { banco: $('bancoC').value, ruta: $('rutaC').value.replace(/\D/g, ''), cuenta: $('cuentaC').value, tipo: $('tipoC').value } : null };
  }
  const b = $('sig'); b.disabled = true; b.textContent = tx('enviando');
  try {
    const r = await fetch(FN_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: ANON, Authorization: 'Bearer ' + ANON }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || 'x');
    if (!SEGURO) { try { localStorage.removeItem(BORR); localStorage.setItem(ENV, JSON.stringify({ n: nombreCompleto(), t: Date.now(), s: serv, h: document.querySelectorAll('.dep').length, i: /Necesitan ITIN/.test(body.comentarios) })); } catch (x) {} }
    mostrarFinal();
  } catch (e) { b.disabled = false; pintar(); error(e.message && e.message !== 'x' && e.message !== 'Failed to fetch' ? e.message : tx('errNet')); }
}

/* ----- final: documentos por Encyro y aviso por WhatsApp ----- */
let finDatos = null;
function pintarDocs() {
  const f = finDatos || {}, l = [];
  if (f.s === 'impuestos' || f.s === 'itin') { l.push('d_w2', 'd_id'); if (f.i || f.s === 'itin') l.push('d_pas'); if (f.h) l.push('d_acta', 'd_esc', 'd_guard'); l.push('d_ant'); }
  else if (f.s === 'migracion') l.push('d_id', 'd_mig'); else l.push('d_id', 'd_otro');
  $('docsLista').innerHTML = l.map(k => '<li>' + tx(k) + '</li>').join('');
  $('btnWa').href = 'https://wa.me/' + WA_OFICINA + '?text=' + encodeURIComponent(tx('waMsg').replace('{n}', nombreCompleto()));
}
function abrirEncyro() { const w = window.open(ENCYRO_URL, '_blank', 'noopener'); if (!w) location.href = ENCYRO_URL; }
function mostrarFinal(guardado) {
  if (guardado) { nombreEnviado = guardado.n; finDatos = guardado; }
  else { nombreEnviado = nombreCompleto(); finDatos = { s: serv, h: document.querySelectorAll('.dep').length, i: $('itinYo').checked || $('espItin').checked || !!document.querySelector('.di:checked') }; }
  $('form').style.display = 'none'; $('yaEnviado').style.display = 'none'; $('gracias').style.display = 'block'; $('barra').style.width = '100%';
  pintar();
  if (SEGURO) { $('pasos2').style.display = 'none'; document.querySelector('#gracias h2').textContent = tx('segOk'); $('gr2').textContent = tx('segOk2'); document.querySelector('#gracias [data-t=p2fin]').style.display = 'none'; }
  else pintarDocs();
  window.scrollTo(0, 0);
}
$('btnDocs').onclick = abrirEncyro;
$('yaDocs').onclick = () => { let env = null; try { env = JSON.parse(localStorage.getItem(ENV) || 'null'); } catch (x) {} mostrarFinal(env || { n: '', s: 'impuestos' }); };
$('yaOtro').onclick = () => { try { localStorage.removeItem(ENV); } catch (x) {} $('yaEnviado').style.display = 'none'; };

/* ----- borrador: si el cliente se sale y regresa, sigue donde iba (nunca se guarda nada delicado) ----- */
const CAMPOS = ['nombre', 'nombre2', 'apellidos', 'sufijo', 'nacimiento', 'telefono', 'correo', 'ocupacion', 'dirCalle', 'dirApto', 'dirCiudad', 'dirEstado', 'dirZip', 'espNombre', 'espApellidos', 'espNac', 'espOcup', 'coment', 'coment2'];
function guardarBorrador() {
  if (SEGURO) return;
  const o = { serv, civil, paso, iy: $('itinYo').checked, ie: $('espItin').checked };
  CAMPOS.forEach(id => { o[id] = $(id).value; });
  o.deps = [...document.querySelectorAll('.dep')].map(d => ({ n: d.querySelector('.dn').value, a: d.querySelector('.da').value, f: d.querySelector('.dd').value, p: d.querySelector('.dp').selectedIndex, m: d.querySelector('.dm').value, i: d.querySelector('.di').checked }));
  try { localStorage.setItem(BORR, JSON.stringify(o)); } catch (x) {}
}
function cargarBorrador() {
  let o = null;
  try { o = JSON.parse(localStorage.getItem(BORR) || 'null'); } catch (x) {}
  if (!o) return;
  CAMPOS.forEach(id => { if (o[id] != null) $(id).value = o[id]; });
  serv = o.serv || ''; civil = o.civil || ''; $('itinYo').checked = !!o.iy; $('espItin').checked = !!o.ie;
  (o.deps || []).forEach(x => addDep(x));
  paso = serv ? Math.min(o.paso || 0, pasos().length - 1) : 0;
}
$('form').addEventListener('input', guardarBorrador);
$('form').addEventListener('change', guardarBorrador);

if (SEGURO) { $('segNombre').value = (Q.get('n') || '').slice(0, 80); }
else {
  const s0 = Q.get('s'); cargarBorrador();
  if (!serv && ['impuestos', 'itin', 'migracion', 'otro'].includes(s0)) { serv = s0; paso = 1; }
  try {
    const env = JSON.parse(localStorage.getItem(ENV) || 'null');
    if (env && Date.now() - env.t < 6 * 3600000) $('yaEnviado').style.display = 'block'; else localStorage.removeItem(ENV);
  } catch (x) {}
}
pintar();
</script>
</body>
</html>
