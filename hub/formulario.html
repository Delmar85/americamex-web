<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AmericaMex Tax · Datos del cliente</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0D2847;--red:#E53935;--bg:#eef2f8;--ink:#1b2535;--muted:#5a6b84;--line:#cfd8e6}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
header{background:var(--navy);color:#fff;padding:18px 16px;text-align:center}
header b{font-size:20px;letter-spacing:.02em}
header small{display:block;opacity:.8;font-weight:600;margin-top:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 60px}
.lang{display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px}
.lang button{border:2px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font:700 13px Montserrat,system-ui,sans-serif;color:var(--navy)}
.lang button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(13,40,71,.08)}
.card h2{margin:0 0 4px;font-size:17px;color:var(--navy)}
.card p.s{margin:0 0 12px;color:var(--muted);font-size:13px;font-weight:600}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;font:600 16px Montserrat,system-ui,sans-serif;color:var(--ink);background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.dep{background:#f4f7fb;border-radius:12px;padding:12px;margin-top:10px;position:relative}
.dep .x{position:absolute;top:6px;right:8px;border:none;background:none;font-size:20px;color:var(--muted)}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:16px;font:800 16px Montserrat,system-ui,sans-serif;background:var(--red);color:#fff;margin-top:6px}
.btn.sec{background:#fff;color:var(--navy);border:2px solid var(--navy);margin-top:12px;padding:12px}
.btn:disabled{opacity:.6}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.seg label{margin:0;border:2px solid var(--line);border-radius:12px;padding:12px;text-align:center;cursor:pointer;color:var(--navy)}
.seg input{display:none}
.seg input:checked+span{font-weight:800}
.seg label:has(input:checked){border-color:var(--navy);background:#dbe8fb}
.note{background:#fff6dc;color:#6b5200;border-radius:12px;padding:12px;font-size:13px;font-weight:600}
.err{background:#fde0e0;color:#a31515;border-radius:12px;padding:12px;font-weight:700;margin-bottom:12px;display:none}
.ok{text-align:center;padding:40px 10px}
.ok .t{font-size:56px}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.opt{font-weight:600;color:#8a97ab}
.docs{list-style:none;margin:0 0 12px;padding:0}
.docs li{padding:9px 12px;background:#f4f7fb;border-radius:10px;margin-bottom:6px;font-weight:600;font-size:14px}
.btn.doc{background:var(--navy)}
.btn.doc.off{background:#9aa8bd}
.steps{display:flex;gap:8px;margin:0 0 14px}
.steps div{flex:1;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12.5px;font-weight:700;color:var(--muted);text-align:center}
.steps div.on{border-color:var(--navy);color:var(--navy);background:#dbe8fb}
.steps div.ok{border-color:#1b7a3a;color:#1b7a3a;background:#e3f3e7}
.paso2{border:3px solid var(--navy)}
.paso2 h2{font-size:19px}
.big{font-size:18px;padding:18px}
.quien{background:#f4f7fb;border-radius:12px;padding:12px;margin:12px 0;font-weight:700;color:var(--navy);text-align:center;font-size:17px}
.aviso{background:#e3f3e7;color:#1b5e2c;border-radius:12px;padding:14px;font-weight:700;margin-bottom:14px}
.aviso button{margin-top:10px}
.sub{font-size:12px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 0}
.preview{display:inline-block;background:#fff6dc;color:#6b5200;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:800;margin-left:6px;vertical-align:middle}
</style>
</head>
<body>
<header><b>AmericaMex Tax</b><small id="hSub"></small></header>
<div class="wrap" id="form">
  <div class="lang"><button type="button" data-l="es" class="on">Español</button><button type="button" data-l="en">English</button></div>
  <div class="steps"><div class="on" data-t="paso1"></div><div data-t="paso2"></div></div>
  <div class="aviso" id="yaEnviado" style="display:none"><span id="yaTxt"></span><button type="button" class="btn doc" id="yaDocs" data-t="subir"></button><button type="button" class="btn sec" id="yaOtro" data-t="otroForm"></button></div>
  <div class="err" id="err"></div>

  <div class="card">
    <h2 data-t="s1"></h2>
    <div class="g2"><div><label data-t="nombre"></label><input id="nombre" autocomplete="given-name" required></div>
    <div><label data-t="nombre2"></label><input id="nombre2" autocomplete="additional-name"></div></div>
    <div class="g3"><div><label data-t="apellidos"></label><input id="apellidos" autocomplete="family-name"></div>
    <div><label data-t="sufijo"></label><select id="sufijo"><option value="">—</option><option>Sr.</option><option>Jr.</option><option>II</option><option>III</option></select></div></div>
    <label data-t="nac"></label><input id="nacimiento" type="date" autocomplete="bday">
    <label data-t="tel"></label><input id="telefono" type="tel" autocomplete="tel">
    <label data-t="correo"></label><input id="correo" type="email" autocomplete="email">
    <label data-t="ocup"></label><input id="ocupacion" autocomplete="organization-title">
    <label data-t="dir"></label><input id="dirCalle" autocomplete="address-line1">
    <div class="g2"><div><label data-t="apto"></label><input id="dirApto" autocomplete="address-line2"></div>
    <div><label data-t="ciudad"></label><input id="dirCiudad" autocomplete="address-level2"></div></div>
    <div class="g2"><div><label data-t="estado"></label><input id="dirEstado" autocomplete="address-level1" maxlength="30"></div>
    <div><label data-t="zip"></label><input id="dirZip" inputmode="numeric" autocomplete="postal-code" maxlength="10"></div></div>
  </div>

  <div class="card">
    <h2 data-t="s2"></h2>
    <div class="seg" id="servicio">
      <label><input type="radio" name="serv" value="impuestos" checked><span data-t="impuestos"></span></label>
      <label><input type="radio" name="serv" value="itin"><span>ITIN</span></label>
      <label><input type="radio" name="serv" value="migracion"><span data-t="migracion"></span></label>
      <label><input type="radio" name="serv" value="otro"><span data-t="otro"></span></label>
    </div>
  </div>

  <div class="card">
    <h2 data-t="s3"></h2><p class="s" data-t="s3s"></p>
    <label data-t="ssn"></label><input id="ssn" inputmode="numeric" autocomplete="off" maxlength="11" placeholder="XXX-XX-XXXX">
    <label data-t="civil"></label>
    <select id="civil"><option value=""></option><option value="soltero" data-t="o_sol"></option><option value="casado" data-t="o_cas"></option><option value="viudo" data-t="o_viu"></option><option value="jefe" data-t="o_jef"></option></select>
    <div id="espWrap" style="display:none">
      <p class="sub" data-t="esp"></p>
      <div class="g2"><div><label data-t="pnom"></label><input id="espNombre" autocomplete="off"></div><div><label data-t="nombre2"></label><input id="espNombre2" autocomplete="off"></div></div>
      <label data-t="apellidos"></label><input id="espApellidos" autocomplete="off">
      <div class="g2"><div><label data-t="nac"></label><input id="espNac" type="date"></div><div><label>SSN / ITIN</label><input id="espSsn" inputmode="numeric" autocomplete="off" maxlength="11"></div></div>
      <label data-t="ocup"></label><input id="espOcup" autocomplete="off">
    </div>
  </div>

  <div class="card">
    <h2 data-t="s4"></h2><p class="s" data-t="s4s"></p>
    <div id="deps"></div>
    <button type="button" class="btn sec" id="addDep" data-t="addDep"></button>
  </div>

  <div class="card">
    <h2 data-t="s5"></h2><p class="s" data-t="s5s"></p>
    <label data-t="banco"></label><input id="banco" autocomplete="off">
    <div class="g2"><div><label data-t="ruta"></label><input id="ruta" inputmode="numeric" maxlength="9" autocomplete="off"></div>
    <div><label data-t="cuenta"></label><input id="cuenta" inputmode="numeric" maxlength="17" autocomplete="off"></div></div>
    <label data-t="tipo"></label><select id="tipoCta"><option value="checking">Checking</option><option value="savings">Savings</option></select>
  </div>

  <div class="card" id="docsCard">
    <h2><span data-t="s6"></span></h2><p class="s" data-t="s6s"></p>
    <ul class="docs">
      <li data-t="d1"></li><li data-t="d2"></li><li data-t="d3"></li><li data-t="d4"></li><li data-t="d5"></li><li data-t="d6"></li>
    </ul>
    <div class="note" data-t="s6n"></div>
  </div>

  <div class="card">
    <label style="margin-top:0" data-t="coment"></label><textarea id="coment" rows="2"></textarea>
    <input class="hp" id="web" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="note" style="margin-top:14px" data-t="priv"></div>
    <button type="button" class="btn" id="enviar" data-t="enviar"></button>
  </div>
</div>
<div class="wrap" id="gracias" style="display:none">
  <div class="steps"><div class="ok" data-t="paso1ok"></div><div class="on" data-t="paso2"></div></div>
  <div class="card ok" style="padding:22px 10px 10px"><div class="t">✅</div><h2 data-t="gracias"></h2><p data-t="gracias2" style="margin:6px 0 0"></p></div>
  <div class="card paso2">
    <h2 data-t="p2t"></h2><p class="s" data-t="p2s"></p>
    <ul class="docs">
      <li data-t="d1"></li><li data-t="d2"></li><li data-t="d3"></li><li data-t="d4"></li><li data-t="d5"></li><li data-t="d6"></li>
    </ul>
    <div class="s" style="font-weight:700;color:var(--muted);font-size:13px" data-t="p2nom"></div>
    <div class="quien" id="quien"></div>
    <button type="button" class="btn doc big" id="btnDocs" data-t="subir"></button>
    <p class="s" style="margin:12px 0 0;text-align:center" data-t="p2fin"></p>
  </div>
</div>

<script>
const FN_URL = 'https://kwebidsoeyfgwtyhoeni.supabase.co/functions/v1/intake';
// Enlace público de Encyro para que el cliente suba sus documentos (paso 2, después de enviar los datos).
const ENCYRO_URL = 'https://www.encyro.com/americamexmultiservices';
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3ZWJpZHNvZXlmZ3d0eWhvZW5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMTM3NTgsImV4cCI6MjEwNjc4OTc1OH0.vD1Mt8VosqFStyrxTCaprQ3Ekzvpi-ZwlFa5aTGLSUw';
const T = {
 es:{hSub:'Formulario de datos del cliente',s1:'Tus datos',nombre:'Primer nombre *',nombre2:'Segundo nombre',dir:'Dirección postal (calle y número)',apto:'Apto / Suite',ciudad:'Ciudad',estado:'Estado',zip:'Código postal',apellidos:'Apellidos',sufijo:'Sr./Jr.',nac:'Fecha de nacimiento',tel:'Teléfono / WhatsApp',correo:'Correo electrónico',
  s2:'¿Qué necesitas?',impuestos:'Impuestos',migracion:'Migración',otro:'Otro',

  s4:'Dependientes (hijos u otros)',s4s:'Agrega a cada uno.',addDep:'+ Agregar dependiente',depN:'Nombre(s)',depA:'Apellido(s)',parent:'Parentesco (hijo, hija…)',
  s5:'Depósito directo (opcional)',s5s:'Para depositarte tu reembolso. Puedes dejarlo vacío.',banco:'Banco',ruta:'Número de ruta (9 dígitos)',cuenta:'Número de cuenta',tipo:'Tipo de cuenta',
  coment:'Comentarios (opcional)',priv:'🔒 Tu información viaja cifrada. Tu SSN y datos de banco se borran automáticamente en 48 horas, después de que los capturemos. Solo guardamos los últimos 4 dígitos de tu SSN para identificarte.',

  paso1:'1. Tus datos',paso2:'2. Documentos',paso1ok:'✓ Datos enviados',ocup:'Ocupación (en qué trabajas)',pnom:'Primer nombre',otroForm:'Llenar otro formulario',
  p2t:'Paso 2: sube tus documentos',p2s:'Seguro y cifrado. Puedes tomar foto con tu celular.',p2nom:'Cuando te lo pida, escribe este nombre para que sepamos que son tuyos:',

  meses:'Meses que vivió contigo este año',falta:'Escribe tu nombre.',errSsn:'El SSN/ITIN debe tener 9 dígitos.',errRuta:'El número de ruta debe tener 9 dígitos.',errNet:'No se pudo enviar. Revisa tu internet e intenta de nuevo.'},
 en:{hSub:'Client information form',s1:'Your information',nombre:'First name *',nombre2:'Middle name',dir:'Mailing address (street and number)',apto:'Apt / Suite',ciudad:'City',estado:'State',zip:'ZIP code',apellidos:'Last name(s)',sufijo:'Sr./Jr.',nac:'Date of birth',tel:'Phone / WhatsApp',correo:'Email',
  s2:'What do you need?',impuestos:'Taxes',migracion:'Immigration',otro:'Other',
  s3:'Social Security (SSN) and filing status',s3s:'If you only have an ITIN, enter your ITIN.',ssn:'SSN or ITIN',civil:'Marital status',o_sol:'Single',o_cas:'Married',o_viu:'Widowed',o_jef:'Single with dependents',esp:'Spouse information',
  s4:'Dependents (children or others)',s4s:'Add each one.',addDep:'+ Add dependent',depN:'First name',depA:'Last name(s)',parent:'Relationship (son, daughter…)',
  s5:'Direct deposit (optional)',s5s:'To deposit your refund. You can leave it empty.',banco:'Bank',ruta:'Routing number (9 digits)',cuenta:'Account number',tipo:'Account type',
  coment:'Comments (optional)',priv:'🔒 Your information is sent encrypted. Your SSN and bank details are automatically deleted within 48 hours after we enter them. We only keep the last 4 digits of your SSN to identify you.',
  s6:'Documents you will need',s6s:'Have them ready: you upload them in the next step, with photos from your phone.',d1:'W-2 and/or 1099 (all that you have)',d2:'ID (California ID or passport)',d3:'Birth certificates of your children',d4:'School records of your children',d5:'Childcare expenses (if any)',d6:'Last year tax return (if you have it)',subir:'📎 Upload my documents',s6n:'👉 First tap «Send my information». Then you will see the button to upload your documents.',enviar:'Send my information',gracias:'Step 1 done! We received your information.',gracias2:'Now upload your documents (step 2).',
  paso1:'1. Your information',paso2:'2. Documents',paso1ok:'✓ Information sent',ocup:'Occupation (your job)',pnom:'First name',otroForm:'Fill out another form',

};
let L = (new URLSearchParams(location.search).get('l') || (navigator.language||'es')).slice(0,2) === 'en' ? 'en' : 'es';
const $ = id => document.getElementById(id);
function pintar(){
  document.documentElement.lang = L;
  document.querySelectorAll('[data-t]').forEach(e => { if (T[L][e.dataset.t] !== undefined) e.textContent = T[L][e.dataset.t]; });
  $('hSub').textContent = T[L].hSub;
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === L));
  document.querySelectorAll('.dep').forEach(d => {
    d.querySelector('.dn').placeholder = T[L].depN; d.querySelector('.da').placeholder = T[L].depA; d.querySelector('.dp').placeholder = T[L].parent;
    d.querySelectorAll('[data-dl]').forEach(x => { x.textContent = T[L][x.dataset.dl]; });
  });
  if ($('quien')) $('quien').textContent = nombreCompleto();
}
document.querySelector('.lang').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { L = b.dataset.l; pintar(); if ($('yaEnviado').style.display === 'block') $('yaTxt').textContent = T[L].ya; } });
function fmtSsn(el){ const d = el.value.replace(/\D/g,'').slice(0,9); el.value = d.length>5 ? d.slice(0,3)+'-'+d.slice(3,5)+'-'+d.slice(5) : (d.length>3 ? d.slice(0,3)+'-'+d.slice(3) : d); }
['ssn','espSsn'].forEach(i => $(i).addEventListener('input', e => fmtSsn(e.target)));
$('civil').addEventListener('change', () => { $('espWrap').style.display = $('civil').value === 'casado' ? 'block' : 'none'; });
function addDep(){
  const d = document.createElement('div'); d.className = 'dep';
  let ms = ''; for (let m = 12; m >= 0; m--) ms += '<option>' + m + '</option>';
  d.innerHTML = '<button type="button" class="x" aria-label="x">✕</button><div class="g2"><input class="dn" autocomplete="off"><input class="da" autocomplete="off"></div>' +
    '<div class="g2"><div><label data-dl="nac"></label><input class="dd" type="date"></div><div><label>SSN / ITIN</label><input class="ds" inputmode="numeric" autocomplete="off" maxlength="11"></div></div>' +
    '<div class="g2"><div><label data-dl="parent"></label><input class="dp" autocomplete="off"></div><div><label data-dl="meses"></label><select class="dm">' + ms + '</select></div></div>';
  d.querySelector('.x').onclick = () => d.remove();
  d.querySelector('.ds').addEventListener('input', e => fmtSsn(e.target));
  $('deps').appendChild(d); pintar();
}
$('addDep').onclick = addDep;
function error(m){ const e = $('err'); e.textContent = m; e.style.display = 'block'; e.scrollIntoView({behavior:'smooth',block:'center'}); }
$('enviar').onclick = async () => {
  $('err').style.display = 'none';
  const nombre = $('nombre').value.trim();
  if (!nombre) { error(T[L].falta); $('nombre').focus(); return; }
  const ssn = $('ssn').value.replace(/\D/g,'');
  if (ssn && ssn.length !== 9) { error(T[L].errSsn); $('ssn').focus(); return; }
  const ruta = $('ruta').value.replace(/\D/g,'');
  if (ruta && ruta.length !== 9) { error(T[L].errRuta); $('ruta').focus(); return; }
  const deps = [...document.querySelectorAll('.dep')].map(d => ({ nombre: d.querySelector('.dn').value, apellidos: d.querySelector('.da').value, nacimiento: d.querySelector('.dd').value, ssn: d.querySelector('.ds').value, parentesco: d.querySelector('.dp').value, meses: d.querySelector('.dm').value })).filter(d => (d.nombre + d.apellidos).trim());
  const body = {
    accion: 'enviar', idioma: L, web: $('web').value, nombre, nombre2: $('nombre2').value, dirCalle: $('dirCalle').value, dirApto: $('dirApto').value, dirCiudad: $('dirCiudad').value, dirEstado: $('dirEstado').value, dirZip: $('dirZip').value, apellidos: $('apellidos').value, sufijo: $('sufijo').value, nacimiento: $('nacimiento').value,
    telefono: $('telefono').value, correo: $('correo').value, ocupacion: $('ocupacion').value, servicio: document.querySelector('input[name=serv]:checked').value,
    ssn, estado_civil: $('civil').value, comentarios: $('coment').value,
    esposo: $('civil').value === 'casado' && ($('espNombre').value + $('espApellidos').value).trim() ? { nombre: $('espNombre').value, nombre2: $('espNombre2').value, apellidos: $('espApellidos').value, nacimiento: $('espNac').value, ssn: $('espSsn').value, ocupacion: $('espOcup').value } : null,
    dependientes: deps,
    banco: ($('banco').value || ruta || $('cuenta').value) ? { banco: $('banco').value, ruta, cuenta: $('cuenta').value, tipo: $('tipoCta').value } : null
  };
  $('enviar').disabled = true;
  try {
    const r = await fetch(FN_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: ANON, Authorization: 'Bearer ' + ANON }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || 'x');
    try { localStorage.removeItem(BORR); localStorage.setItem(ENV, JSON.stringify({ n: nombreCompleto(), t: Date.now() })); } catch (x) {}
    mostrarPaso2();
  } catch (e) { error(e.message && e.message !== 'x' && e.message !== 'Failed to fetch' ? e.message : T[L].errNet); $('enviar').disabled = false; }
};
/* ----- paso 2: documentos (después de enviar los datos) ----- */
const BORR = 'amx_form_borrador', ENV = 'amx_form_enviado';
let nombreEnviado = '';
function nombreCompleto() {
  if (nombreEnviado) return nombreEnviado;
  return [$('nombre').value, $('nombre2').value, $('apellidos').value, $('sufijo').value].map(x => String(x || '').trim()).filter(Boolean).join(' ');
}
function abrirEncyro() {
  const w = window.open(ENCYRO_URL, '_blank', 'noopener');
  if (!w) location.href = ENCYRO_URL;
}
function mostrarPaso2(nombreGuardado) {
  if (nombreGuardado) nombreEnviado = nombreGuardado;
  else nombreEnviado = nombreCompleto();
  $('form').style.display = 'none'; $('gracias').style.display = 'block'; pintar(); window.scrollTo(0, 0);
}
$('btnDocs').onclick = abrirEncyro;
$('yaDocs').onclick = abrirEncyro;
$('yaOtro').onclick = () => { try { localStorage.removeItem(ENV); } catch (x) {} $('yaEnviado').style.display = 'none'; };

/* ----- borrador: si el cliente se sale y regresa, no pierde lo que escribió (nunca se guardan SSN ni banco) ----- */
const CAMPOS_BORR = ['nombre', 'nombre2', 'apellidos', 'sufijo', 'nacimiento', 'telefono', 'correo', 'ocupacion', 'dirCalle', 'dirApto', 'dirCiudad', 'dirEstado', 'dirZip', 'civil', 'espNombre', 'espNombre2', 'espApellidos', 'espNac', 'espOcup', 'coment'];
function guardarBorrador() {
  const o = { serv: (document.querySelector('input[name=serv]:checked') || {}).value };
  CAMPOS_BORR.forEach(id => { o[id] = $(id).value; });
  o.deps = [...document.querySelectorAll('.dep')].map(d => ({ n: d.querySelector('.dn').value, a: d.querySelector('.da').value, f: d.querySelector('.dd').value, p: d.querySelector('.dp').value, m: d.querySelector('.dm').value }));
  try { localStorage.setItem(BORR, JSON.stringify(o)); } catch (x) {}
}
function cargarBorrador() {
  let o = null;
  try { o = JSON.parse(localStorage.getItem(BORR) || 'null'); } catch (x) {}
  if (!o) return;
  CAMPOS_BORR.forEach(id => { if (o[id] != null) $(id).value = o[id]; });
  if (o.serv) { const r = document.querySelector('input[name=serv][value="' + o.serv + '"]'); if (r) r.checked = true; }
  (o.deps || []).forEach(x => { addDep(); const d = [...document.querySelectorAll('.dep')].pop(); d.querySelector('.dn').value = x.n || ''; d.querySelector('.da').value = x.a || ''; d.querySelector('.dd').value = x.f || ''; d.querySelector('.dp').value = x.p || ''; d.querySelector('.dm').value = x.m || '12'; });
  $('espWrap').style.display = $('civil').value === 'casado' ? 'block' : 'none';
}
$('form').addEventListener('input', guardarBorrador);
$('form').addEventListener('change', guardarBorrador);
$('form').addEventListener('click', e => { if (e.target.closest('.x')) setTimeout(guardarBorrador, 0); });

cargarBorrador();
try {
  const env = JSON.parse(localStorage.getItem(ENV) || 'null');
  if (env && Date.now() - env.t < 6 * 3600000) { nombreEnviado = ''; $('yaEnviado').style.display = 'block'; $('yaTxt').textContent = ''; }
  else localStorage.removeItem(ENV);
} catch (x) {}
pintar();
if ($('yaEnviado').style.display === 'block') $('yaTxt').textContent = T[L].ya;
</script>
